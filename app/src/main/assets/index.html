  });
  ctx.globalAlpha=1;
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.22)+')';ctx.fillRect(0,0,W,H)}
}
function frame(ts){const dt=Math.min((ts-last)/16.67||1,2.5);last=ts;update(dt);draw();requestAnimationFrame(frame)}

addEventListener('pointerdown',e=>{if(e.target.closest('button,input,.ov'))return;initAudio();drop()});
addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();initAudio();drop()}});
function afterOver(){plays++;const n=Date.now();if(window.AndroidAds&&plays%3===0&&n-sessionStart>12e4&&n-lastAd>18e4&&n-rewardedAt>18e4){try{AndroidAds.showInterstitial();lastAd=n}catch(e){}}reset()}
$('again').addEventListener('click',()=>{initAudio();afterOver();state='play';$menu.style.display='none';$score.style.opacity=1;document.body.classList.add('playing')});
$('homeB').addEventListener('click',()=>{initAudio();afterOver()});
$mute.addEventListener('click',()=>{muted=!muted;$mute.textContent=muted?'🔇':'🔊';store.set('tk-mute',muted?'1':'0');initAudio();renderSettings()});
if(navigator.share){
  $('share').style.display='inline-block';
  $('share').addEventListener('click',()=>navigator.share({title:'Tık Kule',text:t('st').replace('{n}',score)}).catch(()=>{}));
}
if(window.AndroidAds&&AndroidAds.exitApp){$('exitB').style.display='inline-block';$('exitB').onclick=()=>{try{AndroidAds.exitApp()}catch(e){}}}
function openNick(){$('nkIn').value=pname;$('nkErr').textContent='';$('nk').style.display='flex';setTimeout(()=>{$('nkIn').focus();$('nkIn').select()},60)}
$('nickB').onclick=openNick;
async function myRank(){
  if(!BOARD_URL||!best)return;
  try{const r=await fetch(BOARD_URL+'/scores.json?orderBy="s"&startAt='+(best+1)+'&limitToFirst=1000');const o=(await r.json())||{};const n=Object.keys(o).length;$('rank').textContent='🌍 '+t('rk')+': #'+(n>=1000?'1000+':n+1)}catch(e){}
}
async function report(id,btn){
  try{await fetch(BOARD_URL+'/reports/'+encodeURIComponent(id)+'/'+uid+'.json',{method:'PUT',body:String(Date.now())});btn.disabled=true;btn.textContent='✓';toast(t('rd'))}catch(e){toast(t('of'))}
}
function revive(){revived=true;$over.style.display='none';state='play';combo=0;shake=0;spawn();$score.style.opacity=1;document.body.classList.add('playing')}
window.onRewarded=()=>{if(state==='over'){rewardedAt=Date.now();revive()}};
window.onRewardFail=()=>toast(t('na'));
$('rewB').onclick=()=>{try{AndroidAds.showRewarded()}catch(e){toast(t('na'))}};
window.__back=function(){
  if(paused){resumeGame();return true}
  for(const id of ['se','ac','thp','dy','lg','lb','nk']){const e=$(id);if(e&&e.style.display==='flex'){if(id==='nk'&&!store.get('tk-name'))return true;e.style.display='none';return true}}
  if(state==='over'){afterOver();return true}
  if(Date.now()-backAt<2000)return false;
  backAt=Date.now();toast(t('bk'));return true;
};
$('nkS').onclick=()=>{const r=saveName($('nkIn').value);if(r===true)$('nk').style.display='none';else $('nkErr').textContent=t(r==='bad'?'nb':'ne')};
$('nkIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('nkS').click()});
loginCheck();
if(best>0&&BOARD_URL)setTimeout(()=>globalSubmit(best),2500);
reset();booted=true;applyLang();if(!hadName)openNick();requestAnimationFrame(frame);
</script>
</body>
</html>
